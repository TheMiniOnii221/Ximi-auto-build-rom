name: Xiaomi ROM Builder (Payload to Super)

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'Đường dẫn tải ROM (ZIP Recovery hoặc link trực tiếp payload.bin)'
        required: true
        default: 'https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS3.0.307.0.WNKCNXM/vermeer-ota_full-OS3.0.307.0.WNKCNXM-user-16.0-e8ac729fa5.zip'
        type: string
      device_name:
        description: 'Tên mã thiết bị (Codename)'
        required: false
        default: 'vermeer'
        type: string
      super_size:
        description: 'Kích thước Super Partition tính bằng bytes (Để 0 để tự động tính)'
        required: false
        default: '9663676416'
        type: string
      upload_target:
        description: 'Nơi lưu trữ file ROM'
        required: false
        default: 'gofile'
        type: choice
        options:
          - 'gofile'
          - 'github_release'
          - 'both'

  repository_dispatch:
    types: [build_rom]

jobs:
  build-rom:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Phân giải tham số
        id: params
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "rom_url=${{ github.event.client_payload.rom_url }}" >> $GITHUB_OUTPUT
            echo "device_name=${{ github.event.client_payload.device_name || 'vermeer' }}" >> $GITHUB_OUTPUT
            echo "super_size=${{ github.event.client_payload.super_size || '9663676416' }}" >> $GITHUB_OUTPUT
            echo "upload_target=${{ github.event.client_payload.upload_target || 'gofile' }}" >> $GITHUB_OUTPUT
          else
            echo "rom_url=${{ inputs.rom_url }}" >> $GITHUB_OUTPUT
            echo "device_name=${{ inputs.device_name }}" >> $GITHUB_OUTPUT
            echo "super_size=${{ inputs.super_size }}" >> $GITHUB_OUTPUT
            echo "upload_target=${{ inputs.upload_target }}" >> $GITHUB_OUTPUT
          fi

      - name: Gửi thông báo bắt đầu qua Telegram
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE="🚀 <b>Bắt đầu tiến trình Build ROM!</b>%0A%0A📱 <b>Thiết bị:</b> <code>${{ steps.params.outputs.device_name }}</code>%0A🔗 <b>URL Nguồn:</b> ${{ steps.params.outputs.rom_url }}%0A💾 <b>Super Size:</b> <code>${{ steps.params.outputs.super_size }}</code> bytes%0A☁️ <b>Nơi lưu trữ:</b> <code>${{ steps.params.outputs.upload_target }}</code>%0A⚡ <b>Job ID:</b> <a href=\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\">Theo dõi trực tiếp</a>"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}&parse_mode=HTML&text=${MESSAGE}" || true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free Disk Space (Giải phóng dung lượng ổ đĩa)
        run: |
          echo "Dung lượng đĩa trước khi dọn dẹp:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -a -f || true
          sudo apt-get clean
          echo "Dung lượng đĩa sau khi dọn dẹp:"
          df -h

      - name: Cài đặt công cụ và dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 p7zip-full curl wget python3 jq

          # Cài đặt payload-dumper-go
          echo "Cài đặt payload-dumper-go..."
          wget -q https://github.com/ssut/payload-dumper-go/releases/download/1.2.2/payload-dumper-go_1.2.2_linux_amd64.tar.gz
          tar -xvf payload-dumper-go_1.2.2_linux_amd64.tar.gz
          sudo mv payload-dumper-go /usr/local/bin/
          rm -f payload-dumper-go*

          # Cài đặt lpmake & lpunpack từ AOSP 15 prebuilts
          echo "Cài đặt lpmake & lpunpack..."
          wget -q https://raw.githubusercontent.com/Rprop/aosp15_partition_tools/main/linux_glibc_x86_64/lpmake -O lpmake
          chmod +x lpmake
          sudo mv lpmake /usr/local/bin/

          wget -q https://raw.githubusercontent.com/Rprop/aosp15_partition_tools/main/linux_glibc_x86_64/lpunpack -O lpunpack
          chmod +x lpunpack
          sudo mv lpunpack /usr/local/bin/

          # Kiểm tra các công cụ
          payload-dumper-go -h || true
          lpmake --help || true

      - name: Chạy script Build ROM
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          chmod +x ./build_rom.sh
          ./build_rom.sh "${{ steps.params.outputs.rom_url }}" "${{ steps.params.outputs.device_name }}" "${{ steps.params.outputs.super_size }}"

      - name: Đóng gói sản phẩm Fastboot ROM
        id: package
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}&parse_mode=HTML&text=🗜️ <b>Đang đóng gói file nén Fastboot ROM...</b>" || true
          fi

          cd fastboot_rom_output
          DATE_STR=$(date +'%Y%m%d_%H%M%S')
          ROM_TAG="${{ steps.params.outputs.device_name }}_fastboot_${DATE_STR}"
          echo "rom_tag=$ROM_TAG" >> $GITHUB_OUTPUT

          mkdir -p ../dist
          
          # Nén 1 file 7z duy nhất cho GoFile / Cloud
          echo "Đang nén 1 file duy nhất..."
          7z a -mx=1 "../dist/${ROM_TAG}.7z" ./*
          
          echo "rom_file_path=dist/${ROM_TAG}.7z" >> $GITHUB_OUTPUT
          echo "rom_file_name=${ROM_TAG}.7z" >> $GITHUB_OUTPUT

          ls -lh ../dist/

      # ---------------- UPLOAD LÊN GOFILE.IO ----------------
      - name: Upload lên GoFile.io
        id: upload_gofile
        if: steps.params.outputs.upload_target == 'gofile' || steps.params.outputs.upload_target == 'both'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}&parse_mode=HTML&text=☁️ <b>Đang tải ROM lên GoFile.io (Tốc độ cao)...</b>" || true
          fi

          FILE_PATH="${{ steps.package.outputs.rom_file_path }}"
          echo "Đang tìm máy chủ GoFile tốt nhất..."
          SERVER=$(curl -s https://api.gofile.io/servers | jq -r '.data.servers[0].name // "store1"')
          echo "Server: $SERVER"

          echo "Bắt đầu upload $FILE_PATH ..."
          RESPONSE=$(curl -F "file=@$FILE_PATH" "https://${SERVER}.gofile.io/contents/uploadfile")
          echo "Response: $RESPONSE"

          DOWNLOAD_PAGE=$(echo "$RESPONSE" | jq -r '.data.downloadPage // empty')
          
          if [ -z "$DOWNLOAD_PAGE" ]; then
            echo "Thử lại qua cổng upload chung..."
            RESPONSE=$(curl -F "file=@$FILE_PATH" "https://upload.gofile.io/uploadfile")
            DOWNLOAD_PAGE=$(echo "$RESPONSE" | jq -r '.data.downloadPage // empty')
          fi

          echo "gofile_url=$DOWNLOAD_PAGE" >> $GITHUB_OUTPUT
          echo "GoFile URL: $DOWNLOAD_PAGE"

      # ---------------- UPLOAD LÊN GITHUB RELEASE ----------------
      - name: Đóng gói chia nhỏ cho GitHub Release (Nếu chọn)
        if: steps.params.outputs.upload_target == 'github_release' || steps.params.outputs.upload_target == 'both'
        run: |
          mkdir -p dist_release
          7z a -v1900m "dist_release/${{ steps.package.outputs.rom_tag }}.7z" ./fastboot_rom_output/*

      - name: Tạo GitHub Release
        id: create_release
        if: steps.params.outputs.upload_target == 'github_release' || steps.params.outputs.upload_target == 'both'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.rom_tag }}
          name: "Fastboot ROM: ${{ steps.params.outputs.device_name }} - $(date +'%d/%m/%Y')"
          body: |
            ## Fastboot ROM Build Thành Công 🚀
            - **Thiết bị:** `${{ steps.params.outputs.device_name }}`
            - **URL Nguồn:** `${{ steps.params.outputs.rom_url }}`
          files: dist_release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---------------- THÔNG BÁO HOÀN TẤT VỀ TELEGRAM ----------------
      - name: Gửi thông báo hoàn tất qua Telegram
        if: success() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE="🎉 <b>Build ROM Hoàn Tất 100%!</b>%0A%0A📱 <b>Thiết bị:</b> <code>${{ steps.params.outputs.device_name }}</code>%0A📦 <b>Tệp nén:</b> <code>${{ steps.package.outputs.rom_file_name }}</code>%0A"

          if [ -n "${{ steps.upload_gofile.outputs.gofile_url }}" ]; then
            MESSAGE="${MESSAGE}%0A⚡ <b>Link tải GoFile (1 file duy nhất, Max speed):</b>%0A👉 <a href=\"${{ steps.upload_gofile.outputs.gofile_url }}\">${{ steps.upload_gofile.outputs.gofile_url }}</a>%0A"
          fi

          if [ "${{ steps.params.outputs.upload_target }}" != "gofile" ]; then
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${{ steps.package.outputs.rom_tag }}"
            MESSAGE="${MESSAGE}%0A🐙 <b>Link GitHub Releases:</b>%0A<a href=\"${RELEASE_URL}\">${RELEASE_URL}</a>%0A"
          fi

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}&parse_mode=HTML&text=${MESSAGE}" || true

      - name: Gửi thông báo thất bại qua Telegram
        if: failure() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          LOG_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MESSAGE="❌ <b>Build ROM Thất Bại!</b>%0A%0A📱 <b>Thiết bị:</b> <code>${{ steps.params.outputs.device_name }}</code>%0A🔗 <b>Log lỗi:</b> <a href=\"${LOG_URL}\">Xem chi tiết lỗi tại đây</a>"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}&parse_mode=HTML&text=${MESSAGE}" || true
